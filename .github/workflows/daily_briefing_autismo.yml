name: Notícias Autismo Brasil (1x/Dia às 09h)

on:
  schedule:
    # 1 execução diária às 09:20 BRT (UTC-3) -> 12:20 UTC (minuto 20 evita fila do GitHub):
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-briefing-publisher
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    env:
      TZ: 'America/Sao_Paulo'

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar com a branch main
        run: |
          git pull origin main

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Notícias Autismo Brasil
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          python run_noticias_autismo.py

      - name: Comitar e Enviar Novas Edições
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/ reports/
          if ! git diff --staged --quiet; then
            git commit -m "chore(autismo): nova edição diária de autismo gerada [skip ci]"
            if ! git push origin main; then
              echo "Push direto rejeitado (remoto atualizado). Sincronizando e resolvendo índice..."
              git pull origin main --no-rebase -X theirs || true
              python scripts/resolve_archive_index.py
              git add public/data/archive_index.json
              git diff --staged --quiet || git commit -m "chore(merge): sincroniza catálogo de edições [skip ci]"
              git push origin main
            fi
          fi
