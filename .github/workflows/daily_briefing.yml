name: Fatos da Região — Curitiba & PR (3x/Dia)

on:
  schedule:
    # 3 execuções diárias no Horário de Brasília (BRT, UTC-3):
    # - 08:00 BRT -> 11:00 UTC
    # - 13:00 BRT -> 16:00 UTC
    # - 19:00 BRT -> 22:00 UTC
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    env:
      TZ: 'America/Sao_Paulo'

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Fatos da Região (Curitiba & PR)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          python run_fatos_da_regiao.py

      - name: Comitar e Enviar Novas Edições para Vercel
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/ reports/
          git diff --staged --quiet || (git commit -m "chore(briefing): nova edição gerada e arquivada [skip ci]" && git push origin main)
